<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Music">
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><title>Music</title>
<style>
:root{--bg:#000;--s1:#111;--s2:#1c1c1e;--l:#2c2c2e;--g:#8e8e93;--t:#fff;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{padding-top:var(--sa)}
.v{position:absolute;inset:var(--sa) 0 calc(64px + var(--sb)) 0;overflow-y:auto;padding:16px 20px 90px;display:none;-webkit-overflow-scrolling:touch}
.v.on{display:block;animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:8px 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sb));padding-bottom:var(--sb);display:flex;background:rgba(10,10,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--l);z-index:5}
nav button{flex:1;color:var(--g);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--t)}nav svg{width:24px;height:24px}
svg{fill:currentColor}
/* now playing */
#np{text-align:center;display:none;flex-direction:column;align-items:center}#np.on{display:flex}
.art{width:min(80vw,40vh);aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#2a2a2d,#0e0e10);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 24px 60px rgba(255,255,255,.05),0 20px 50px #000;transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.art img{width:100%;height:100%;object-fit:cover}.art svg{width:38%;color:#48484a}
.art.pp{transform:scale(.88)}
#ti{font-size:22px;font-weight:700;margin-top:28px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ar{color:var(--g);margin-top:4px;font-size:17px}
.sk{width:100%;margin-top:24px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),#3a3a3c var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
.tm{display:flex;justify-content:space-between;color:var(--g);font-size:12px;margin-top:-4px;font-variant-numeric:tabular-nums}
.ct{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;margin-top:14px}
.ct button{width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#d1d1d6;border-radius:50%;transition:transform .12s}
.ct button:active{transform:scale(.9)}.ct svg{width:30px;height:30px}
.ct #pl{width:72px;height:72px;background:#fff;color:#000}.ct #pl svg{width:34px;height:34px}
.ct .sm svg{width:22px;height:22px;color:var(--g)}.ct .sm.on svg{color:#fff}
.sl{margin-top:18px;color:var(--g);font-size:14px;padding:8px 16px;border-radius:20px;background:var(--s2)}
.sl.on{color:#000;background:#fff}
/* lists */
.sr{display:flex;gap:8px;margin-bottom:6px}
input[type=search],select{flex:1;background:var(--s2);color:#fff;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:0;-webkit-user-select:text;user-select:text}
select{flex:0 0 auto}
.imp{display:inline-block;background:#fff;color:#000;font-weight:600;padding:10px 16px;border-radius:20px;font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #1a1a1c}
.row .th{width:48px;height:48px;border-radius:6px;background:var(--s2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.row .th img{width:100%;height:100%;object-fit:cover}.row .th svg{width:20px;color:#48484a}
.row .tx{flex:1;min-width:0}.row b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--g);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur b{color:#fff;font-weight:700}.row .mo{width:36px;height:36px;color:var(--g);font-size:20px}
.em{color:var(--g);text-align:center;padding:48px 20px;line-height:1.5}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}.bar button{background:var(--s2);padding:9px 16px;border-radius:20px;font-size:14px}.bar .w{background:#fff;color:#000;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between}.top button{color:var(--g);font-size:15px}
.mini{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--sb));background:var(--s2);border-radius:14px;padding:8px 12px;display:none;align-items:center;gap:10px;z-index:4;box-shadow:0 8px 30px #000}
.mini.on{display:flex}.mini .th{width:40px;height:40px;border-radius:6px;background:var(--l);overflow:hidden;flex:none}.mini .th img{width:100%;height:100%;object-fit:cover}
.mini .tx{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini button{width:38px;height:38px}.mini svg{width:24px;height:24px}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;animation:f .2s}
.sh>div{width:100%;max-height:70%;overflow-y:auto;background:var(--s2);border-radius:18px 18px 0 0;padding:8px 8px calc(12px + var(--sb));animation:u .25s cubic-bezier(.3,.9,.3,1)}@keyframes u{from{transform:translateY(40%)}}
.sh h3{font-size:14px;color:var(--g);font-weight:500;padding:12px;text-align:center}
.sh button{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:10px;font-size:17px}.sh button:active{background:var(--l)}.sh .d{color:#ff453a}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<audio id="a" preload="auto" playsinline></audio>
<section class="v on" id="np-v"><div id="np" class="on">
<div class="art" id="art"></div><div id="ti">Nothing playing</div><div id="ar">Import music in Library</div>
<div class="sk"><input type="range" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div></div>
<div class="ct"><button class="sm" id="sh" aria-label="Shuffle"></button><button id="pv" aria-label="Previous"></button><button id="pl" aria-label="Play"></button><button id="nx" aria-label="Next"></button><button class="sm" id="rp" aria-label="Repeat"></button></div>
<button class="sl" id="slp">Sleep timer</button></div></section>
<section class="v" id="lib-v"><h1>Library</h1>
<label class="imp">Import songs<input type="file" id="fi" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple hidden></label>
<div class="sr" style="margin-top:14px"><input type="search" id="q" placeholder="Search"><select id="so"><option value="title">Title</option><option value="artist">Artist</option><option value="added">Recent</option></select></div>
<div id="ll"></div></section>
<section class="v" id="pls-v"></section>
<div class="mini" id="mini"><div class="th" id="mth"></div><div class="tx" id="mtx"></div><button id="mpl"></button><button id="mnx"></button></div>
<nav><button data-t="np-v" class="on"></button><button data-t="lib-v"></button><button data-t="pls-v"></button></nav>
<script>
const $=s=>document.querySelector(s),A=$('#a');
const I={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>',
next:'<svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zm10 0h2v12h-2z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/></svg>',
shuf:'<svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 4 3 4H17v-3l4 4-4 4v-3h-3.5l-3.5-4.7L6.5 17H3v-2h2.5L9 12 5.5 9H3V7h3.5L10 11.700 13.500 7H17z"/></svg>',
rep:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>',
note:'<svg viewBox="0 0 24 24"><path d="M12 3v10.600A4 4 0 1 0 14 17V7h4V3z"/></svg>',
np:'<svg viewBox="0 0 24 24"><path d="M12 3v10.600A4 4 0 1 0 14 17V7h4V3z"/></svg>Now Playing',lib:'<svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zm5 0h3v16H9zm5.500.5l2.900-.8 4 15.200-2.900.8z"/></svg>Library',pls:'<svg viewBox="0 0 24 24"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm13 0v-3l6 2.500z"/></svg>Playlists'};
$('#sh').innerHTML=I.shuf;$('#rp').innerHTML=I.rep;$('#pv').innerHTML=I.prev;$('#nx').innerHTML=I.next;$('#mnx').innerHTML=I.next;
document.querySelectorAll('nav button').forEach(b=>b.innerHTML=I[b.dataset.t.split('-')[0]]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,songs=[],by={},queue=[],qi=-1,st=JSON.parse(localStorage.mst||'{}'),cur=null,curURL=null,view=null,endAt=0,stopEnd=false,tmr=null;
st.pl=st.pl||[];st.sort=st.sort||'title';st.rep=st.rep||0;st.sh=!!st.sh;
const save=()=>localStorage.mst=JSON.stringify(st);
/* storage */
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('music',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=(m,f)=>new Promise((r,j)=>{const t=db.transaction('s',m),o=f(t.objectStore('s'));t.oncomplete=()=>r(o.result);t.onerror=()=>j(t.error);t.onabort=()=>j(t.error)});
/* id3 */
const dec=(d,e)=>{let b=d.subarray(1);try{if(e==1&&b[0]==0xFE&&b[1]==0xFF)e=2;return new TextDecoder(['iso-8859-1','utf-16le','utf-16be','utf-8'][e]||'utf-8').decode(b).replace(/\0/g,'').replace(/^\uFEFF/,'').trim()}catch(x){return''}};
async function tags(f){const o={title:f.name.replace(/\.[^.]+$/,''),artist:'Unknown artist',album:'',art:null};
try{const b=new Uint8Array(await f.slice(0,3<<20).arrayBuffer());if(String.fromCharCode(b[0],b[1],b[2])!=='ID3')return o;
const v=b[3],end=Math.min(10+((b[6]<<21)|(b[7]<<14)|(b[8]<<7)|b[9]),b.length);let p=10;
while(p+10<end){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
const n=v==4?((b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7]);if(!n||p+10+n>b.length)break;
const d=b.subarray(p+10,p+10+n);
if(id=='TIT2')o.title=dec(d,d[0])||o.title;else if(id=='TPE1')o.artist=dec(d,d[0])||o.artist;else if(id=='TALB')o.album=dec(d,d[0]);
else if(id=='APIC'&&!o.art){const e=d[0];let i=1;while(d[i])i++;let m=String.fromCharCode(...d.subarray(1,i));i+=2;
if(e==0||e==3){while(d[i])i++;i++}else{while(d[i]||d[i+1])i+=2;i+=2}
o.art=new Blob([d.slice(i)],{type:m.includes('/')?m:'image/jpeg'})}
p+=10+n}}catch(x){}return o}
/* artwork */
const au={};const aurl=s=>s.art?(au[s.id]=au[s.id]||URL.createObjectURL(s.art)):'';
const adata=s=>new Promise(r=>{if(!s.art)return r('');const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r('');f.readAsDataURL(s.art)});
const thumb=s=>`<div class="th">${s.art?`<img src="${aurl(s)}" alt="">`:I.note}</div>`;
/* player */
function setPlayIcon(){const p=!A.paused;$('#pl').innerHTML=p?I.pause:I.play;$('#mpl').innerHTML=p?I.pause:I.play;$('#art').classList.toggle('pp',!p&&!!cur);if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused'}
async function load(i,go=true){if(i<0||i>=queue.length)return;qi=i;const s=by[queue[i]];if(!s)return;cur=s;
if(curURL)URL.revokeObjectURL(curURL);curURL=URL.createObjectURL(s.file);A.src=curURL;
ui();if(go)A.play().catch(()=>{});meta(s)}
async function meta(s){if(!('mediaSession'in navigator))return;const d=await adata(s);
navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album||'',artwork:d?[{src:d,sizes:'512x512'}]:[]})}
function ui(){const s=cur;$('#ti').textContent=s?s.title:'Nothing playing';$('#ar').textContent=s?s.artist:'Import music in Library';
$('#art').innerHTML=s&&s.art?`<img src="${aurl(s)}" alt="">`:I.note;$('#mini').classList.toggle('on',!!s&&!$('#np-v').classList.contains('on'));
$('#mth').innerHTML=s&&s.art?`<img src="${aurl(s)}" alt="">`:'';$('#mtx').textContent=s?s.title+' – '+s.artist:'';setPlayIcon();hl()}
const hl=()=>document.querySelectorAll('.row[data-id]').forEach(r=>r.classList.toggle('cur',cur&&r.dataset.id==cur.id));
function next(auto){if(!queue.length)return;let n;if(st.sh&&queue.length>1){do n=Math.floor(Math.random()*queue.length);while(n==qi)}else{n=qi+1;if(n>=queue.length){if(st.rep==1||!auto)n=0;else{load(0,false);A.pause();return}}}load(n)}
function prev(){if(A.currentTime>3||!queue.length){A.currentTime=0;return}load(qi>0?qi-1:queue.length-1)}
function toggle(){if(!cur){if(songs.length)playList(sorted().map(s=>s.id),0);return}A.paused?A.play().catch(()=>{}):A.pause()}
function playList(ids,i){queue=ids.slice();load(i)}
A.onplay=A.onpause=setPlayIcon;
A.onended=()=>{if(stopEnd){stopEnd=false;clr();A.pause();return}if(st.rep==2){A.currentTime=0;A.play()}else next(true)};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
let drag=false,lastPos=0;
A.ontimeupdate=()=>{const d=A.duration||0;if(!drag){const v=d?A.currentTime/d*1000:0;$('#sk').value=v;$('#sk').style.setProperty('--p',v/10+'%')}
$('#cu').textContent=fmt(A.currentTime);$('#du').textContent=fmt(d);
if(endAt&&Date.now()>=endAt)sleepNow();
if('mediaSession'in navigator&&d&&Date.now()-lastPos>1000){lastPos=Date.now();try{navigator.mediaSession.setPositionState({duration:d,playbackRate:A.playbackRate,position:Math.min(A.currentTime,d)})}catch(e){}}};
A.onloadedmetadata=A.ontimeupdate;
$('#sk').oninput=e=>{drag=true;e.target.style.setProperty('--p',e.target.value/10+'%');$('#cu').textContent=fmt(e.target.value/1000*A.duration)};
$('#sk').onchange=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration;drag=false};
$('#pl').onclick=$('#mpl').onclick=toggle;$('#nx').onclick=$('#mnx').onclick=()=>next(false);$('#pv').onclick=prev;
$('#sh').onclick=()=>{st.sh=!st.sh;save();modes()};$('#rp').onclick=()=>{st.rep=(st.rep+1)%3;save();modes()};
function modes(){$('#sh').classList.toggle('on',st.sh);$('#rp').classList.toggle('on',st.rep>0);$('#rp').style.opacity=st.rep==2?1:'';$('#rp').title=['Repeat off','Repeat all','Repeat one'][st.rep];
$('#rp').innerHTML=I.rep+(st.rep==2?'<span style="position:absolute;font-size:9px;font-weight:700;margin:-2px 0 0 1px;color:#fff">1</span>':'')}
if('mediaSession'in navigator){const m=navigator.mediaSession,h=(a,f)=>{try{m.setActionHandler(a,f)}catch(e){}};
h('play',()=>A.play());h('pause',()=>A.pause());h('previoustrack',prev);h('nexttrack',()=>next(false));
h('seekto',d=>{A.currentTime=d.seekTime});h('seekbackward',d=>{A.currentTime=Math.max(0,A.currentTime-(d.seekOffset||10))});h('seekforward',d=>{A.currentTime=Math.min(A.duration||0,A.currentTime+(d.seekOffset||10))})}
/* sleep timer */
function clr(){clearTimeout(tmr);endAt=0;stopEnd=false;$('#slp').classList.remove('on');$('#slp').textContent='Sleep timer'}
function sleepNow(){clr();A.pause()}
function setSleep(min){clr();$('#slp').classList.add('on');if(min==='end'){stopEnd=true;$('#slp').textContent='Sleep: end of song';return}
endAt=Date.now()+min*60000;tmr=setTimeout(sleepNow,min*60000);const u=()=>{if(!endAt)return;$('#slp').textContent='Sleep in '+Math.ceil((endAt-Date.now())/60000)+' min';setTimeout(u,15000)};u()}
$('#slp').onclick=()=>sheet('Stop playback after',[...[5,15,30,45,60,90].map(m=>({l:m+' minutes',f:()=>setSleep(m)})),{l:'End of current song',f:()=>setSleep('end')},...(endAt||stopEnd?[{l:'Turn off timer',f:clr,c:'d'}]:[])]);
/* sheet */
function sheet(t,items){const o=document.createElement('div');o.className='sh';const c=document.createElement('div');c.innerHTML=`<h3>${esc(t)}</h3>`;
items.forEach(it=>{const b=document.createElement('button');b.innerHTML=it.l;if(it.c)b.className=it.c;b.onclick=e=>{e.stopPropagation();it.f();if(it.keep)b.innerHTML=it.l2?it.l2():b.innerHTML;else o.remove()};c.appendChild(b)});
o.appendChild(c);o.onclick=()=>o.remove();document.body.appendChild(o)}
/* library */
const sorted=()=>{const q=$('#q').value.trim().toLowerCase(),k=st.sort;
let a=songs.filter(s=>!q||(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(q));
return a.sort((x,y)=>k=='added'?y.added-x.added:(x[k]||'').localeCompare(y[k]||'',undefined,{sensitivity:'base'}))};
const row=(s,more)=>`<div class="row${cur&&cur.id==s.id?' cur':''}" data-id="${s.id}">${thumb(s)}<div class="tx"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div><button class="mo" data-m="${s.id}" aria-label="More">⋯</button></div>`;
function renderLib(){const a=sorted();$('#ll').innerHTML=a.length?a.map(s=>row(s)).join(''):`<div class="em">${songs.length?'No matches.':'No songs yet.<br>Tap “Import songs” and pick audio files from the Files app.'}</div>`}
$('#so').value=st.sort;$('#so').onchange=e=>{st.sort=e.target.value;save();renderLib()};$('#q').oninput=renderLib;
$('#ll').onclick=e=>{const m=e.target.closest('[data-m]');if(m){e.stopPropagation();return songMenu(m.dataset.m,'lib')}
const r=e.target.closest('.row');if(r){const a=sorted().map(s=>s.id);playList(a,a.indexOf(r.dataset.id));show('np-v')}};
function songMenu(id,ctx,pid){const it=[{l:'Add to playlist…',f:()=>pickPl(id)}];
if(ctx=='pl')it.push({l:'Remove from this playlist',f:()=>{const p=st.pl.find(x=>x.id==pid);p.ids=p.ids.filter(x=>x!=id);save();renderPls()}});
it.push({l:'Delete from library',c:'d',f:()=>delSong(id)});sheet(by[id].title,it)}
function pickPl(id){if(!st.pl.length)return sheet('No playlists yet',[{l:'Create playlist',f:()=>{newPl(id)}}]);
sheet('Add to playlist',[...st.pl.map(p=>({l:esc(p.name),f:()=>{if(!p.ids.includes(id))p.ids.push(id);save();renderPls()}})),{l:'New playlist…',f:()=>newPl(id)}])}
async function delSong(id){if(!confirm('Delete this song from the device?'))return;await tx('readwrite',s=>s.delete(id));songs=songs.filter(s=>s.id!=id);delete by[id];
st.pl.forEach(p=>p.ids=p.ids.filter(x=>x!=id));save();if(cur&&cur.id==id){A.pause();A.removeAttribute('src');cur=null;queue=[];ui()}renderLib();renderPls()}
$('#fi').onchange=async e=>{const fs=[...e.target.files];let n=0;const b=$('.imp');
for(const f of fs){b.firstChild.textContent=`Importing ${++n}/${fs.length}…`;const t=await tags(f);
const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),file:f,added:Date.now(),...t};
try{await tx('readwrite',o=>o.put(s));songs.push(s);by[s.id]=s}catch(x){alert('Could not store “'+f.name+'”. The device may be out of space.')}}
b.firstChild.textContent='Import songs';e.target.value='';renderLib();navigator.storage&&navigator.storage.persist&&navigator.storage.persist()};
/* playlists */
function newPl(add){const n=prompt('Playlist name');if(!n||!n.trim())return;const p={id:Date.now().toString(36),name:n.trim(),ids:add?[add]:[]};st.pl.push(p);save();renderPls()}
function renderPls(){const el=$('#pls-v');
if(view){const p=st.pl.find(x=>x.id==view);if(!p){view=null;return renderPls()}const ids=p.ids.filter(i=>by[i]);
el.innerHTML=`<div class="top"><button id="bk">‹ Playlists</button></div><h1>${esc(p.name)}</h1><div class="bar"><button class="w" id="pp">Play</button><button id="ad">Add songs</button><button id="rn">Rename</button><button id="dl" style="color:#ff453a">Delete</button></div>
<div>${ids.length?ids.map(i=>row(by[i])).join(''):'<div class="em">This playlist is empty.</div>'}</div>`;
$('#bk').onclick=()=>{view=null;renderPls()};$('#pp').onclick=()=>{if(ids.length){playList(ids,0);show('np-v')}};
$('#rn').onclick=()=>{const n=prompt('Rename playlist',p.name);if(n&&n.trim()){p.name=n.trim();save();renderPls()}};
$('#dl').onclick=()=>{if(confirm('Delete “'+p.name+'”? Songs stay in your library.')){st.pl=st.pl.filter(x=>x!=p);save();view=null;renderPls()}};
$('#ad').onclick=()=>sheet('Tap songs to add or remove',sorted().map(s=>{const tick=()=>(p.ids.includes(s.id)?'✓ ':'&nbsp;&nbsp;&nbsp;&nbsp;')+esc(s.title);return{l:tick(),l2:tick,keep:1,f:()=>{p.ids=p.ids.includes(s.id)?p.ids.filter(x=>x!=s.id):[...p.ids,s.id];save()}}}));
el.onclick=e=>{const m=e.target.closest('[data-m]');if(m){e.stopPropagation();return songMenu(m.dataset.m,'pl',p.id)}const r=e.target.closest('.row');if(r){playList(ids,ids.indexOf(r.dataset.id));show('np-v')}};
el.querySelectorAll('.sh').forEach(x=>x.onclick=()=>x.remove());return}
el.innerHTML=`<div class="top"><h1>Playlists</h1><button id="np2">New</button></div>`+(st.pl.length?st.pl.map(p=>`<div class="row" data-p="${p.id}"><div class="th">${I.note}</div><div class="tx"><b>${esc(p.name)}</b><small>${p.ids.filter(i=>by[i]).length} songs</small></div></div>`).join(''):'<div class="em">No playlists yet.<br>Tap “New” to create one.</div>');
$('#np2').onclick=()=>newPl();el.onclick=e=>{const r=e.target.closest('[data-p]');if(r){view=r.dataset.p;renderPls()}}}
/* nav */
function show(id){document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id==id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==id));
$('#np').classList.toggle('on',id=='np-v');$('#mini').classList.toggle('on',!!cur&&id!='np-v')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('#mini').onclick=e=>{if(!e.target.closest('button'))show('np-v')};
/* init */
(async()=>{db=await open();songs=await tx('readonly',s=>s.getAll());songs.forEach(s=>by[s.id]=s);modes();renderLib();renderPls();ui();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
